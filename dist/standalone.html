<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrandGuard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500;600&display=swap">
<style>
/* Layout: persistent top bar; a queue/insights/library workspace; the review screen is a two-column
   editor (content left, findings and approvals right). All colour comes from tokens below. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --surface-2: #F7F9FA; --ink: #14202B; --muted: #566472; --line: #DAE1E7;
  --accent: #0A6C74; --accent-ink: #FFFFFF; --accent-soft: #E2F1F2;
  --blocker: #B3261E; --blocker-bg: #FCEBE9; --major: #A64B00; --major-bg: #FDEFE0;
  --minor: #7A6200; --minor-bg: #FBF3D2; --info: #2B58A6; --info-bg: #E6EEFA;
  --good: #1B7A4B; --good-bg: #E1F4EA; --ins: #D7F2E0; --del: #FBDADA;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #16202A; --surface-2: #1B2733; --ink: #E7EDF2; --muted: #9DAAB7; --line: #2A3745;
    --accent: #4CC2CC; --accent-ink: #06222A; --accent-soft: #15333A;
    --blocker: #FF8A80; --blocker-bg: #3A1B1A; --major: #FFB070; --major-bg: #38250F;
    --minor: #E8CF63; --minor-bg: #33290B; --info: #8DB4F5; --info-bg: #17284A;
    --good: #6FD6A0; --good-bg: #123226; --ins: #14402A; --del: #4A1F1F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16202A; --surface-2: #1B2733; --ink: #E7EDF2; --muted: #9DAAB7; --line: #2A3745;
  --accent: #4CC2CC; --accent-ink: #06222A; --accent-soft: #15333A;
  --blocker: #FF8A80; --blocker-bg: #3A1B1A; --major: #FFB070; --major-bg: #38250F;
  --minor: #E8CF63; --minor-bg: #33290B; --info: #8DB4F5; --info-bg: #17284A;
  --good: #6FD6A0; --good-bg: #123226; --ins: #14402A; --del: #4A1F1F; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
body, .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: 0; padding-right: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 28px; line-height: 1.15; } h2 { font-size: 21px; } h3 { font-size: 17px; }
h4 { margin: 0; font-size: 14px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.sr { position: absolute; left: -9999px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top-in { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 0; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 20px; font-weight: 600; margin-right: 8px; background: none; border: 0; cursor: pointer; padding: 0; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.who { white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.who select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.badge-ai { font-size: 12px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface-2); color: var(--muted); cursor: pointer; }
.badge-ai b { color: var(--good); font-weight: 600; }

main { padding-block: 24px 64px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--blocker); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
input[type=text], input[type=date], input[type=number], select, textarea { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); width: 100%; }
textarea { font-family: var(--mono); font-size: 13px; line-height: 1.6; resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.btn-chip { cursor: pointer; } .chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.st-draft { } .st-in_review { background: var(--info-bg); color: var(--info); border-color: transparent; }
.st-changes_requested { background: var(--major-bg); color: var(--major); border-color: transparent; }
.st-approved, .st-published { background: var(--good-bg); color: var(--good); border-color: transparent; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }

/* queue */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.item:last-child { border-bottom: 0; } .item:hover { background: var(--surface-2); }
.item h3 { font-size: 16px; } .item .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.score { font-family: var(--mono); font-weight: 600; min-width: 46px; text-align: center; padding: 4px 8px; border-radius: 6px; }
.sc-good { background: var(--good-bg); color: var(--good); } .sc-mid { background: var(--minor-bg); color: var(--minor); } .sc-bad { background: var(--blocker-bg); color: var(--blocker); }
.todo { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.todo .card { flex: 1 1 220px; padding: 12px 14px; } .todo b { font-family: var(--display); font-size: 26px; display: block; line-height: 1.1; }

/* review screen */
.review { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 960px) { .review { grid-template-columns: minmax(0, 1fr); } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.doc { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; font-size: 15px; line-height: 1.75; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 160px; }
.doc.code { font-family: var(--mono); font-size: 13px; }
mark.m { background: transparent; color: inherit; border-radius: 3px; cursor: pointer; text-decoration: underline wavy; text-underline-offset: 3px; text-decoration-thickness: 1.5px; padding: 1px 0; }
mark.m.blocker { background: var(--blocker-bg); text-decoration-color: var(--blocker); } mark.m.major { background: var(--major-bg); text-decoration-color: var(--major); }
mark.m.minor { background: var(--minor-bg); text-decoration-color: var(--minor); } mark.m.info { background: var(--info-bg); text-decoration-color: var(--info); }
mark.m.done { background: transparent; text-decoration: underline dotted; opacity: .7; } mark.m.active { outline: 2px solid var(--accent); }
.scorebar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 12px; }
.ring { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 18px; }
.sev-count { display: flex; gap: 6px; flex-wrap: wrap; }
.sevchip { padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.sevchip.blocker, .sev.blocker { background: var(--blocker-bg); color: var(--blocker); } .sevchip.major, .sev.major { background: var(--major-bg); color: var(--major); }
.sevchip.minor, .sev.minor { background: var(--minor-bg); color: var(--minor); } .sevchip.info, .sev.info { background: var(--info-bg); color: var(--info); }
.sev { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; }
.findings { display: flex; flex-direction: column; gap: 10px; }
.f { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; border-left-width: 4px; display: flex; flex-direction: column; gap: 8px; }
.f.blocker { border-left-color: var(--blocker); } .f.major { border-left-color: var(--major); } .f.minor { border-left-color: var(--minor); } .f.info { border-left-color: var(--info); }
.f.flash { box-shadow: 0 0 0 2px var(--accent); }
.f.done { opacity: .72; }
.f header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.f .match { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 4px 8px; border-radius: 4px; overflow-wrap: anywhere; margin: 0; }
.ba { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.ba del { background: var(--del); text-decoration: line-through; padding: 0 4px; border-radius: 3px; } .ba ins { background: var(--ins); text-decoration: none; padding: 0 4px; border-radius: 3px; }
.sugg { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.f details { font-size: 13px; color: var(--muted); } .f summary { cursor: pointer; }
.f details .src { margin-top: 6px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; color: var(--ink); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.decided { font-size: 13px; color: var(--muted); }
.panel-t { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; gap: 8px; flex-wrap: wrap; }
.approvals { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; } .dot.ok { background: var(--good); } .dot.no { background: var(--major); }
.cm { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); } .cm .h { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.diff { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; line-height: 1.7; }
.diff ins { background: var(--ins); text-decoration: none; } .diff del { background: var(--del); }
.preview { width: 100%; height: 220px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.imgbox { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; padding: 14px; } .imgbox img { max-width: min(100%, 320px); border-radius: 8px; border: 1px solid var(--line); }
.sw { display: inline-block; width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line); vertical-align: middle; }

/* insights */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { padding: 14px 16px; } .kpi b { font-family: var(--display); font-size: 32px; line-height: 1.1; display: block; font-variant-numeric: tabular-nums; } .kpi span { color: var(--muted); font-size: 13px; }
.bars { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.bar { display: grid; grid-template-columns: minmax(120px, 42%) 1fr 36px; gap: 10px; align-items: center; font-size: 13px; }
.bar .t { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; } .bar .t i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar .n { font-variant-numeric: tabular-nums; text-align: right; }
table { border-collapse: collapse; width: 100%; font-size: 13px; } th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; } th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tw { overflow-x: auto; }
.note { background: var(--info-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.warn { background: var(--major-bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 20; }
.prose p { margin: 0 0 10px; max-width: 75ch; } .prose ul { margin: 0 0 12px; padding-left: 20px; max-width: 75ch; } .prose li { margin-bottom: 4px; }
@media (prefers-reduced-motion: no-preference) { .f, .btn { transition: box-shadow .15s, filter .15s, border-color .15s; } }
@media (max-width: 600px) { .item { grid-template-columns: 1fr auto; } .item .score { display: none; } }

<script>
/* BrandGuard review engine.
 * Pure, deterministic, dependency-free. Runs in the browser and in Node.
 * Every finding cites the guideline or approved fact that produced it.
 * No network calls, no model calls: content never leaves the process.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.BrandEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var SEV_ORDER = ['blocker', 'major', 'minor', 'info'];
  var SEV_WEIGHT = { blocker: 25, major: 10, minor: 4, info: 1 };

  // ---------- helpers ----------
  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function blank(m) { return m.replace(/[^\n]/g, ' '); }

  function maskFor(format, body) {
    var t = body;
    if (format === 'html') {
      t = t.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>|<!--[\s\S]*?-->/gi, blank);
      t = t.replace(/<[^>]*>/g, blank);
      t = t.replace(/&[a-zA-Z#0-9]+;/g, blank);
    } else if (format === 'markdown') {
      t = t.replace(/```[\s\S]*?```/g, blank).replace(/`[^`\n]*`/g, blank);
      t = t.replace(/\]\([^)\n]*\)/g, blank);
      t = t.replace(/^[ \t]{0,3}#{1,6}[ \t]/gm, blank);
    }
    return t.replace(/https?:\/\/[^\s)>"']+/g, blank);
  }

  function matchCase(src, repl) {
    if (!repl) return repl;
    if (src.length > 1 && src === src.toUpperCase() && /[A-Z]/.test(src)) return repl.toUpperCase();
    var c = src.charAt(0);
    if (c !== c.toLowerCase()) return repl.charAt(0).toUpperCase() + repl.slice(1);
    return repl;
  }

  function sourceOf(kit, id) {
    var g = (kit.guidelines || []).filter(function (x) { return x.id === id; })[0];
    if (g) return { type: 'guideline', id: g.id, title: g.title, quote: g.text, confidential: !!g.confidential };
    var f = (kit.facts || []).filter(function (x) { return x.id === id; })[0];
    if (f) return { type: 'fact', id: f.id, title: f.label, quote: f.statement, asOf: f.asOf, origin: f.source, confidential: false };
    return { type: 'guideline', id: id, title: id, quote: '' };
  }

  function parseNum(s, suffix) {
    var n = parseFloat(String(s).replace(/,/g, ''));
    if (suffix && /k/i.test(suffix)) n *= 1000;
    return n;
  }
  function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // colour utils
  var NAMED = { white: '#ffffff', black: '#000000' };
  function parseColor(v) {
    v = String(v).trim().toLowerCase();
    if (NAMED[v]) v = NAMED[v];
    var m = /^#([0-9a-f]{3})$/.exec(v);
    if (m) return m[1].split('').map(function (c) { return parseInt(c + c, 16); });
    m = /^#([0-9a-f]{6})$/.exec(v);
    if (m) return [0, 2, 4].map(function (i) { return parseInt(m[1].substr(i, 2), 16); });
    return null;
  }
  function toHex(rgb) { return '#' + rgb.map(function (x) { return ('0' + Math.round(x).toString(16)).slice(-2); }).join(''); }
  function lum(rgb) {
    var a = rgb.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
  }
  function contrast(a, b) {
    var l1 = lum(a), l2 = lum(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  function dist(a, b) { return Math.sqrt(Math.pow(a[0] - b[0], 2) + Math.pow(a[1] - b[1], 2) + Math.pow(a[2] - b[2], 2)); }
  function isNeutral(rgb) { return Math.max.apply(null, rgb) - Math.min.apply(null, rgb) < 18; }
  function paletteRgb(kit) {
    return (kit.palette || []).map(function (p) { return { name: p.name, hex: p.hex, rgb: parseColor(p.hex) }; }).filter(function (p) { return p.rgb; });
  }
  function nearestPalette(kit, rgb) {
    var best = null, bd = 1e9;
    paletteRgb(kit).forEach(function (p) { var d = dist(p.rgb, rgb); if (d < bd) { bd = d; best = p; } });
    return best ? { entry: best, d: bd } : null;
  }

  function syll(w) {
    w = w.toLowerCase().replace(/[^a-z]/g, '');
    if (!w) return 0;
    if (w.length <= 3) return 1;
    w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
    var m = w.match(/[aeiouy]{1,2}/g);
    return Math.max(1, m ? m.length : 1);
  }
  function words(t) { return t.match(/[A-Za-z0-9][A-Za-z0-9'’-]*/g) || []; }
  function flesch(t) {
    var w = words(t); if (w.length < 5) return null;
    var s = (t.match(/[.!?]+(\s|$)/g) || []).length || 1;
    var sy = w.reduce(function (a, x) { return a + syll(x); }, 0);
    return 206.835 - 1.015 * (w.length / s) - 84.6 * (sy / w.length);
  }

  // ---------- review ----------
  function review(input, kit, opts) {
    opts = opts || {};
    var today = opts.today || new Date().toISOString().slice(0, 10);
    var raw = input.body || '';
    var format = input.format || 'text';
    var channel = input.channel || 'web';
    var masked = maskFor(format, raw);
    var meta = input.imageMeta || null;
    var out = [];

    function add(f) {
      f.severity = f.severity || 'minor';
      f.start = f.start == null ? -1 : f.start;
      f.end = f.end == null ? -1 : f.end;
      f.match = f.start >= 0 ? raw.slice(f.start, f.end) : (f.match || '');
      f.source = f.source || null;
      out.push(f);
    }
    function rx(p, flags) { return new RegExp(p, flags || 'gi'); }
    function each(text, re, fn) {
      var m; re.lastIndex = 0;
      while ((m = re.exec(text))) { fn(m); if (m[0].length === 0) re.lastIndex++; }
    }

    // 1. confidentiality (raw text, strongest rule)
    (kit.confidentialTerms || []).forEach(function (t) {
      each(raw, rx('\\b' + escapeRe(t) + '\\b'), function (m) {
        add({ ruleId: 'conf.codename', category: 'confidentiality', severity: 'blocker',
          title: 'Unreleased or confidential name', start: m.index, end: m.index + m[0].length,

        decisions: {}, comments: [{ id: 'k1', by: 'u-priya', at: t(1), text: 'Launch is Monday. Happy to cut anything that needs Legal.' }], approvals: [], history: [{ at: t(1), by: 'u-priya', text: 'Created draft' }] },

  // Sample governance history so Insights has something to show. Clearly labelled as sample data in the UI.
  function log(today) {
    var s = 7;
    function rnd() { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
    var R = [
      ['term.users', 'Use "customer" instead of "user"', 'terminology', 22, 0.05, 0.0],

    var authors = ['u-priya', 'u-marcus', 'u-marcus'];
    for (i = 0; i < 150; i++) {
      var x = rnd() * total, r = R[0], acc = 0;
      for (var j = 0; j < R.length; j++) { acc += R[j][3]; if (x <= acc) { r = R[j]; break; } }
      var age = Math.floor(Math.pow(rnd(), 0.8) * 56);
      var a = authors[Math.floor(rnd() * 3)];

  }

  return { kit: kit, users: users, contents: contents, log: log };

<script>
/* BrandGuard UI. Vanilla JS, no framework. State lives in memory and is mirrored to localStorage. */
(function () {
  'use strict';
  var E = window.BrandEngine, S = window.BrandSeed;
  var KEY = 'brandguard.v1';
  var today = function () { return new Date().toISOString().slice(0, 10); };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  function fresh() { var t = today(); return { v: 1, kit: clone(S.kit), users: clone(S.users), me: 'u-priya', contents: S.contents(t), log: S.log(t), seq: 100 }; }
  function load() { try { var s = localStorage.getItem(KEY); var o = s && JSON.parse(s); return o && o.v === 1 ? o : null; } catch (e) { return null; } }
  var state = load() || fresh();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable: keep working in memory */ } }

  var ui = { view: 'queue', id: null, tab: 'content', editing: false, draft: '', filter: 'all', pending: null, libTab: 'guidelines', diffV: null, resolvedOpen: false, newFmt: 'text', cmFinding: null };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function user(id) { return state.users.filter(function (u) { return u.id === id; })[0] || { name: 'Unknown', role: 'creator' }; }
  function me() { return user(state.me); }
  function cnt(id) { return state.contents.filter(function (c) { return c.id === id; })[0]; }
  function latest(c) { return c.versions[c.versions.length - 1]; }
  function uid(p) { return p + (++state.seq); }
  function ago(iso) { var d = Math.round((Date.now() - new Date(iso)) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }
  function toast(t) { var old = document.querySelector('.toast'); if (old) old.remove(); var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600); }
  var STATUS = { draft: 'Draft', in_review: 'In review', changes_requested: 'Changes requested', approved: 'Approved', published: 'Published' };
  var ROLE = { creator: 'Creator', manager: 'Manager', reviewer: 'Reviewer', admin: 'Admin' };
  var CAT = { tone: 'Tone', language: 'Language', terminology: 'Terminology', claims: 'Claims', facts: 'Facts', messaging: 'Messaging', visual: 'Visual', accessibility: 'Accessibility', confidentiality: 'Confidentiality' };
  var SEVN = { blocker: 'Blocker', major: 'Major', minor: 'Minor', info: 'Note' };
  var FMT = { text: 'Plain text', markdown: 'Markdown', html: 'HTML', image: 'Image' };

  function reviewOf(c, body) {
    var v = latest(c);
    return E.review({ body: body != null ? body : v.body, format: c.format, channel: c.channel, imageMeta: v.imageMeta }, state.kit, { today: today() });
  }
  function isResolved(c, f) { var d = c.decisions[f.key]; return !!d && (d.state === 'dismissed' || d.state === 'waived'); }
  function scoreClass(s) { return s >= 85 ? 'sc-good' : s >= 60 ? 'sc-mid' : 'sc-bad'; }
  function logOutcome(c, f, outcome, unclear) {
    state.log.push({ at: new Date().toISOString(), ruleId: f.ruleId, title: f.title, category: f.category, authorId: c.authorId, outcome: outcome, unclear: !!unclear, contentId: c.id });
  }
  function hist(c, text) { c.history.push({ at: new Date().toISOString(), by: state.me, text: text }); }

  // ---------- permissions ----------
  function isAuthor(c) { return c.authorId === state.me; }
  function canEdit(c) { var r = me().role; return (isAuthor(c) || r === 'admin') && (c.status === 'draft' || c.status === 'changes_requested'); }
  function requiredRoles(c) { var r = reviewOf(c); return E.approvalPolicy(r.findings, c.decisions); }
  function approvedBy(c, role) { var v = latest(c).v; return c.approvals.some(function (a) { return a.role === role && a.decision === 'approved' && a.version === v; }); }
  function myApprovalRole(c) {
    var r = me().role; if (isAuthor(c)) return null;
    if (r === 'manager' || r === 'admin') return 'manager'; if (r === 'reviewer') return 'reviewer'; return null;
  }
  function refreshStatus(c) {
    if (c.status === 'published') return;
    var v = latest(c).v;
    if (c.status === 'in_review' || c.status === 'approved') {
      if (c.approvals.some(function (a) { return a.version === v && a.decision === 'changes'; })) { c.status = 'changes_requested'; return; }
      var need = requiredRoles(c).roles;
      c.status = need.every(function (r) { return approvedBy(c, r); }) ? 'approved' : 'in_review';
    }
  }

  // ---------- actions ----------
  function newVersion(c, body, note, extra) {
    var v = latest(c), nv = { v: v.v + 1, body: body, by: state.me, at: new Date().toISOString(), note: note };
    if (v.imageMeta) { nv.imageMeta = clone(v.imageMeta); nv.thumb = v.thumb; }
    if (extra) for (var k in extra) nv[k] = extra[k];
    c.versions.push(nv);
    if (c.status === 'approved' || c.status === 'in_review') { c.status = 'draft'; hist(c, 'Edited after review: approvals reset'); }
    hist(c, 'Saved v' + nv.v + (note ? ' (' + note + ')' : ''));
  }
  function applyFinding(c, f, input) {
    if (f.fix && f.fix.input && !String(input || '').trim()) { toast('Add the text first'); return; }
    if (ui.editing) {
      ui.draft = E.applyFix(ui.draft, f, input); logOutcome(c, f, 'fixed'); toast('Applied to your draft. Save to keep it.');
    } else if (f.fix.type === 'setAlt') {
      newVersion(c, latest(c).body, 'Added alt text', { imageMeta: Object.assign(clone(latest(c).imageMeta), { alt: input }) }); logOutcome(c, f, 'fixed'); toast('Alt text added');
    } else {
      newVersion(c, E.applyFix(latest(c).body, f, input), 'Applied: ' + f.title); logOutcome(c, f, 'fixed'); toast('Suggestion applied as a new version');
    }

  }
  function decide(c, f, state_, reason) {
    c.decisions[f.key] = { state: state_, by: state.me, reason: reason || '', at: new Date().toISOString(), ver: latest(c).v };
    logOutcome(c, f, state_); hist(c, (state_ === 'waived' ? 'Waived' : 'Dismissed') + ': ' + f.title + (reason ? ' (' + reason + ')' : '')); save();
  }

  // ---------- rendering ----------
  var app = document.getElementById('app');
  function render() {
    var navs = [['queue', 'Review queue'], ['insights', 'Insights'], ['library', 'Brand library'], ['about', 'Trust and audit']];
    var h = '<div class="top"><div class="top-in"><button class="brand" data-act="nav" data-v="queue" aria-label="BrandGuard home"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="var(--accent)"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="var(--accent-ink)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>BrandGuard</button><nav class="nav" aria-label="Main">' +
      navs.map(function (n) { return '<button data-act="nav" data-v="' + n[0] + '"' + (ui.view === n[0] || (ui.view === 'content' && n[0] === 'queue') || ui.view === 'new' && n[0] === 'queue' ? ' aria-current="page"' : '') + '>' + n[1] + '</button>'; }).join('') +
      '</nav><span class="spacer"></span><button class="badge-ai" data-act="nav" data-v="about" title="How AI and external services are used"><b>No external AI.</b> Content stays in this browser</button>' +
      '<div class="who"><label class="muted" for="who">Viewing as</label><select id="who" data-chg="who">' +
      state.users.map(function (u) { return '<option value="' + u.id + '"' + (u.id === state.me ? ' selected' : '') + '>' + esc(u.name) + ' · ' + ROLE[u.role] + '</option>'; }).join('') + '</select></div></div></div><main class="wrap" id="main">';
    if (ui.view === 'queue') h += viewQueue(); else if (ui.view === 'new') h += viewNew(); else if (ui.view === 'content') h += viewContent();
    else if (ui.view === 'insights') h += viewInsights(); else if (ui.view === 'library') h += viewLibrary(); else h += viewAbout();
    app.innerHTML = h + '</main>';
    if (ui.view === 'content') updateDirty();
  }

  // ----- queue -----
  function needsMe(c) {
    var r = me().role;
    if ((c.status === 'draft' || c.status === 'changes_requested') && isAuthor(c)) return true;
    if (c.status === 'in_review' && !isAuthor(c)) {
      var role = myApprovalRole(c); if (!role) return false;
      return requiredRoles(c).roles.indexOf(role) > -1 && !approvedBy(c, role);
    }
    if (c.status === 'approved' && (r === 'manager' || r === 'admin')) return true;
    return false;
  }
  function viewQueue() {
    var list = state.contents.slice().sort(function (a, b) { return latest(b).at < latest(a).at ? -1 : 1; });

    list.forEach(function (c) { if (c.status !== 'published') blk += reviewOf(c).findings.filter(function (f) { return f.severity === 'blocker' && !isResolved(c, f); }).length; });
    var f = ui.filter, shown = list.filter(function (c) { return f === 'all' || (f === 'mine' ? needsMe(c) : c.status === f); });

      (me().role !== 'reviewer' ? '<button class="btn primary" data-act="newc">New content</button>' : '') + '</div>' +
      '<div class="todo"><div class="card"><b>' + mine + '</b><span class="muted">waiting on you</span></div><div class="card"><b>' + inrev + '</b><span class="muted">in review</span></div><div class="card"><b>' + blk + '</b><span class="muted">open blockers across unpublished work</span></div></div>' +

  function viewNew() {
    var img = ui.newFmt === 'image';
    return '<div class="page-head"><div><h1>New content</h1><p>Paste text, import a .txt, .md or .html file, or upload an image. Nothing is uploaded to a server.</p></div><button class="btn" data-act="nav" data-v="queue">Cancel</button></div>' +
      '<div class="card grid" style="max-width:820px"><div class="row"><div class="field" style="flex:2;min-width:220px"><label for="n-title">Title</label><input type="text" id="n-title" placeholder="e.g. Black Friday email"></div>' +
